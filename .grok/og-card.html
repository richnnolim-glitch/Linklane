<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Card Serif";
    src: url("file:///usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  @font-face {
    font-family: "Card Sans";
    src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Card Sans";
    src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #f3efe6;
  }
  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    background:
      radial-gradient(ellipse 80% 60% at 50% 42%, #f7f4ee 0%, #f3efe6 55%, #ebe4d6 100%);
    color: #1a1814;
  }
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.18;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
  }
  .frame {
    position: absolute;
    inset: 28px;
    border: 1px solid #e3dcd0;
    pointer-events: none;
  }
  .frame::after {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid #e3dcd0;
    opacity: 0.7;
  }
  .lockup {
    position: absolute;
    left: 0;
    right: 0;
    top: 78px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .eyebrow {
    font-family: "Card Sans", sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.34em;
    color: #746c62;
    text-transform: uppercase;
  }
  h1 {
    margin-top: 18px;
    font-family: "Card Serif", serif;
    font-weight: 700;
    font-size: 118px;
    line-height: 0.9;
    letter-spacing: -0.035em;
    color: #1a1814;
  }
  .rule {
    width: 72px;
    height: 4px;
    margin-top: 22px;
    border-radius: 2px;
    background: #c2410c;
  }
  .tag {
    margin-top: 16px;
    font-family: "Card Sans", sans-serif;
    font-size: 26px;
    letter-spacing: 0.01em;
    color: #746c62;
  }
  .scene {
    position: absolute;
    left: 50%;
    bottom: 72px;
    transform: translateX(-50%);
    width: 640px;
    height: 148px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grain"></div>
    <div class="frame"></div>
    <div class="lockup">
      <div class="eyebrow">Windows · Linux · Android</div>
      <h1>Linklane</h1>
      <div class="rule"></div>
      <div class="tag">The local file drop</div>
    </div>
    <svg class="scene" viewBox="0 0 640 148" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- the lane stays between the devices -->
      <rect x="118" y="86" width="404" height="6" rx="3" fill="#c2410c"/>
      <!-- laptop -->
      <g>
        <rect x="46" y="28" width="128" height="82" rx="6" fill="#1a1814"/>
        <rect x="54" y="36" width="112" height="60" rx="3" fill="#f3efe6"/>
        <rect x="64" y="72" width="46" height="5" rx="2" fill="#c2410c"/>
        <rect x="34" y="110" width="152" height="8" rx="2" fill="#1a1814"/>
        <rect x="58" y="118" width="104" height="5" rx="1.5" fill="#1a1814"/>
      </g>
      <!-- phone hotspot: arcs sit above the handset -->
      <g>
        <path d="M304 18 a16 16 0 0 0 32 0" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
        <path d="M292 12 a28 28 0 0 0 56 0" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
        <rect x="292" y="36" width="56" height="92" rx="8" fill="#1a1814"/>
        <rect x="298" y="46" width="44" height="68" rx="3" fill="#f3efe6"/>
        <circle cx="320" cy="122" r="3" fill="#c2410c"/>
      </g>
      <!-- small tower -->
      <g>
        <rect x="470" y="40" width="72" height="86" rx="5" fill="#1a1814"/>
        <rect x="482" y="54" width="48" height="8" rx="2" fill="#f3efe6"/>
        <rect x="482" y="70" width="48" height="8" rx="2" fill="#e3dcd0"/>
        <circle cx="494" cy="108" r="4" fill="#c2410c"/>
        <rect x="458" y="126" width="96" height="6" rx="2" fill="#1a1814"/>
      </g>
    </svg>
  </div>
</body>
</html>
